<app-header title="Health Checks"></app-header>

<main>
<mat-card>
  <mat-card-content>

    <div class="refresh-controls">
      <button mat-button (click)="refresh.reload()"><mat-icon cedarIcon="refresh"></mat-icon> Reload</button>
      <mat-checkbox [checked]="refresh.enabled" (change)="refresh.setEnabled($event.checked)">Refresh every 5s</mat-checkbox>
    </div>

    <div class="button-row">
      <button mat-button>
        <mat-icon cedarIcon="health"></mat-icon>
        Microservice health check summary:
      </button>
      <button mat-raised-button color="{{nrLoaded === nrTotal ? 'primary' : 'warn'}}">{{nrLoaded}}
        of {{nrTotal}} loaded
      </button>
      <button mat-raised-button color="{{nrErrored > 0 ? 'warn' : 'primary'}}">{{nrErrored}} errored</button>
    </div>
  </mat-card-content>
</mat-card>

<mat-card class="wrapper-card">
  <mat-card-content class="flex-container">

    @for (serverName of serverNames; track serverName) {
      <mat-card class="dash-card" [routerLink]="'/health-checks'">
        <mat-card-header>
          <div mat-card-avatar>
            <mat-icon color="{{getServerColor(serverName)}}" cedarIcon="health"></mat-icon>
          </div>
          <mat-card-title>
            {{serverName}}
          </mat-card-title>
          <mat-card-subtitle>{{getStatus(serverName)}}</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
    }

  </mat-card-content>
</mat-card>
</main>
