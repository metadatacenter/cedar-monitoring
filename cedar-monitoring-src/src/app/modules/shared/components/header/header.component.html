<mat-toolbar color="primary">
  <button mat-icon-button class="example-icon" [routerLink]="'/'" aria-label="Home">
    <mat-icon cedarIcon="home"></mat-icon>
  </button>
  <div style="width:100%">
    <a [routerLink]="'/'">CEDAR Monitoring View@if (title) {
      - {{title}}
    }</a>
  </div>

  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User">
    <mat-icon cedarIcon="user"></mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/profile">
      <mat-icon cedarIcon="user"></mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item (click)="openCEDARPage()">
      <mat-icon cedarIcon="home"></mat-icon>
      <span>CEDAR</span>
    </button>
    <button mat-menu-item (click)="openLogout()">
      <mat-icon cedarIcon="sign-out"></mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>

</mat-toolbar>
